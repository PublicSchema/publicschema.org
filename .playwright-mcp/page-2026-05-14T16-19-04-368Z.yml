        - heading "ILO SDMX SDG indicators relevant to social protection — seed metric catalog" [level=1] [ref=e37]
        - paragraph [ref=e38]:
          - generic [ref=e39]: ilo_sdg_seed
        - paragraph [ref=e40]: "Auto-generated seed from ILO's SDMX 2.1 dataflow registry, filtered to SDG indicators relevant to social protection delivery. The selection rule is derivability from PublicSchema record-level data: each kept indicator can be computed (now or with a small slot addition) from Person.employment_status, Person.occupation, Person.industry, Person.status_in_employment, Enrollment in Program, etc. Macro indicators and country-level qualitative ratings are excluded. Trilingual labels (en/es/fr) come from the SDMX <common:Name> elements; dimensions and attributes are derived from each DSD's authoritative DimensionList and AttributeList. Calculations, concept URIs, and dimension/attribute catalogue definitions are out of scope for this seed and tracked as TODOs."
