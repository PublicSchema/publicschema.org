id: https://publicschema.org/linkml/education
name: publicschema-education
title: Education provision and qualifications
description: Draft education providers, sites, programmes, offerings and professional qualifications.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- common
- identity
- value_types
classes:
  EducationProvider:
    class_uri: publicschema:edu/EducationProvider
    title: Education Provider
    description: An organization responsible for providing education or training, independently of its
      physical premises or online delivery sites. This is the institutional provider; School describes
      a physical education service point.
    slots:
    - provider_programmes
    status: bibo:draft
    is_a: Organization
    annotations:
      source_domain: edu
      bibliography_refs: '["gov-gias", "gov-org"]'
  ProviderSite:
    class_uri: publicschema:edu/ProviderSite
    title: Provider Site
    description: A physical or virtual site through which an education provider delivers learning. A virtual
      site has no implied street address; a provider may use several sites and a physical School may be
      linked without duplicating it.
    slots:
    - name
    - identifiers
    - education_provider
    - physical_service_point
    - virtual_site_url
    status: bibo:draft
    annotations:
      source_domain: edu
      bibliography_refs: '["gov-gias", "gov-org"]'
  EducationProgramme:
    class_uri: publicschema:edu/EducationProgramme
    title: Education Programme
    description: An organized programme of learning offered by an education provider. It is distinct from
      a campus, an individual enrolment, and the qualification awarded on completion.
    slots:
    - name
    - identifiers
    - programme_classification
    - programme_award
    status: bibo:draft
    annotations:
      source_domain: edu
      bibliography_refs: '["gov-isced"]'
  EducationOffering:
    class_uri: publicschema:edu/EducationOffering
    title: Education Offering
    description: A provider's offering of an identified education programme at specified physical or
      virtual provider sites over a period. Separate offerings distinguish campuses, intakes or
      delivery modes without creating different programme identities. An offering is neither an
      individual enrolment nor evidence that the programme or site is accredited.
    slots:
    - name
    - identifiers
    - offering_programme
    - offering_provider
    - offering_sites
    - offering_mode
    - offering_award
    - start_date
    - end_date
    status: bibo:draft
    annotations:
      source_domain: edu
      bibliography_refs: '["gov-schema-course"]'
  ProfessionalQualification:
    class_uri: publicschema:ProfessionalQualification
    title: Professional Qualification
    description: A qualification awarded to a person by an organization, recording an achievement rather
      than permission to practise.
    slots:
    - person
    - qualification_title
    - qualification_awarder
    - issue_date
    - identifiers
    status: bibo:draft
    annotations:
      bibliography_refs: '["gov-fhir-practitioner"]'
slots:
  provider_programmes:
    slot_uri: publicschema:edu/provider_programmes
    title: Provider programmes
    description: Programmes offered by the education provider.
    range: EducationProgramme
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: edu
      category: classification
  education_provider:
    slot_uri: publicschema:edu/education_provider
    title: Education provider
    description: The institutional provider using this delivery site.
    range: EducationProvider
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: edu
      category: governance
  physical_service_point:
    slot_uri: publicschema:edu/physical_service_point
    title: Physical service point
    description: A physical service point associated with this provider site. Omit for an entirely virtual
      site.
    range: ServicePoint
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: edu
      category: location
  virtual_site_url:
    slot_uri: publicschema:edu/virtual_site_url
    title: Virtual site url
    description: The address of an online environment through which learning is delivered, rather than
      merely the provider home page.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: edu
      category: location
  programme_classification:
    slot_uri: publicschema:edu/programme_classification
    title: Programme classification
    description: Scheme-qualified classification of the educational programme, such as an ISCED programme
      level.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: edu
      category: classification
  programme_award:
    slot_uri: publicschema:edu/programme_award
    title: Programme award
    description: The qualification or other recognition normally awarded on completing the programme.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: edu
      category: classification
  qualification_title:
    slot_uri: publicschema:qualification_title
    title: Qualification title
    description: The name of the qualification awarded to the person.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
  qualification_awarder:
    slot_uri: publicschema:qualification_awarder
    title: Qualification awarder
    description: The organization that awarded the professional qualification.
    range: Organization
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
  offering_programme:
    slot_uri: publicschema:edu/offering_programme
    title: Offering programme
    description: The education programme delivered through this offering. A different offering need
      not imply a different programme.
    range: EducationProgramme
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
      domain_override: edu
  offering_provider:
    slot_uri: publicschema:edu/offering_provider
    title: Offering provider
    description: The institutional education provider responsible for this offering.
    range: EducationProvider
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: edu
  offering_sites:
    slot_uri: publicschema:edu/offering_sites
    title: Offering sites
    description: Physical or virtual provider sites through which this offering is delivered. A shared
      programme list on the provider does not imply that every site delivers every programme.
    range: ProviderSite
    multivalued: true
    status: bibo:draft
    annotations:
      category: location
      domain_override: edu
  offering_mode:
    slot_uri: publicschema:edu/offering_mode
    title: Offering mode
    description: A scheme-qualified delivery or study mode of this offering, such as online or part-time.
      A mode does not identify a delivery site or imply that a learner attended.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      category: classification
      domain_override: edu
  offering_award:
    slot_uri: publicschema:edu/offering_award
    title: Offering award
    description: The URI of the qualification or award definition normally obtained on successful
      completion of this offering. It identifies an expected award kind in its source catalog, never
      a qualification already awarded to an individual. No award is inferred when it is omitted.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
      domain_override: edu
