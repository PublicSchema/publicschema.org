notes: DHS Recode7 hv246a to hv246k. Each variable records the number of animals the household owns; the
  code here is the variable name. hv246a to hv246f have standard labels and hv246g to hv246k are country
  specific. LivestockType describes animals kept on a farm whether or not it owns them, so no pair is
  exact. Qualities follow the SKOS direction; broad means the DHS variable is broader than the PublicSchema
  value, and narrow means it is narrower. Some DHS phases use different subsets of these variables.
