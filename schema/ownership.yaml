id: https://publicschema.org/linkml/ownership
name: publicschema-ownership
title: Ownership and control
description: Draft ownership interests, legal arrangements and ownership chain assertions.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- common
- vocabularies
- value_types
classes:
  OwnershipInterest:
    class_uri: publicschema:OwnershipInterest
    title: Ownership Interest
    description: An assertion of one ownership or control interest in an organization or legal arrangement, held by a person,
      organization or legal arrangement. Separate interests may coexist. An indirect interest is not a verified
      ownership chain or a determination of beneficial ownership under a particular law.
    slots:
    - interest_holder
    - interest_entity
    - interest_type
    - interest_directness
    - interest_percentage
    - interest_minimum_percentage
    - interest_exclusive_minimum_percentage
    - interest_maximum_percentage
    - interest_exclusive_maximum_percentage
    - interest_description
    - start_date
    - end_date
    status: bibo:draft
    annotations:
      bibliography_refs: '["gov-bods-04"]'
  LegalArrangement:
    class_uri: publicschema:LegalArrangement
    title: Legal Arrangement
    description: An identified legal mechanism through which persons or organizations associate to
      exercise ownership or control without the mechanism itself being a separate institutional body.
      A trust with separate legal personality is a LegalEntity instead. Identifying an arrangement does
      not establish the identity, rights or beneficial ownership of its participants.
    slots:
    - name
    - identifiers
    - arrangement_type
    status: bibo:draft
    annotations:
      bibliography_refs: '["gov-bods-04"]'
  OwnershipChainAssertion:
    class_uri: publicschema:OwnershipChainAssertion
    title: Ownership Chain Assertion
    description: An assertion identifying component interests that describe a route of indirect
      ownership or control. Components are an unordered set of separately identified interests, each
      with its own endpoints and period. Their inclusion does not verify the route, calculate an
      effective percentage or determine a beneficial owner. Evidence and recording time belong to
      the RegistryEntry describing this assertion.
    slots:
    - indirect_interest
    - component_interests
    status: bibo:draft
    annotations:
      bibliography_refs: '["gov-bods-04"]'
slots:
  interest_holder:
    slot_uri: publicschema:interest_holder
    title: Interest holder
    description: The URI of the person, organization or legal arrangement asserted to hold this
      interest. The consuming profile checks existence and kind.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      sensitivity: sensitive
  interest_entity:
    slot_uri: publicschema:interest_entity
    title: Interest entity
    description: The URI of the organization or legal arrangement in which this interest is held.
      The consuming profile checks existence and kind; a Person is not the target entity.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
  interest_type:
    slot_uri: publicschema:interest_type
    title: Interest type
    description: A scheme-qualified code identifying the mechanism of ownership or control, such as shares
      or voting rights.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
  interest_directness:
    slot_uri: publicschema:interest_directness
    title: Interest directness
    description: Whether this asserted interest is direct, indirect or of unknown directness.
    range: InterestDirectness
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
  interest_percentage:
    slot_uri: publicschema:interest_percentage
    title: Interest percentage
    description: An exact asserted percentage for this interest, on a scale from zero to one hundred.
      Omit when only a band or uncertain amount is known; preserve that qualification in interest_description.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
  interest_description:
    slot_uri: publicschema:interest_description
    title: Interest description
    description: An explanation of the interest, including bounds, uncertainty or the route of indirect
      control. This is not a structured ownership-chain proof.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
  arrangement_type:
    slot_uri: publicschema:arrangement_type
    title: Arrangement type
    description: A scheme-qualified kind of legal arrangement, such as a trust or nomination agreement.
      Its legal treatment depends on the applicable jurisdiction.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
      domain_override: 'null'
  indirect_interest:
    slot_uri: publicschema:indirect_interest
    title: Indirect interest
    description: The separately asserted indirect interest whose route is described by these component
      interests. Several chain assertions may describe different routes for the same interest.
    range: OwnershipInterest
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
  component_interests:
    slot_uri: publicschema:component_interests
    title: Component interests
    description: Separately identified interests offered as components of the asserted indirect route.
      Array position carries no meaning. Reference resolution, connected endpoints and compatible
      periods require profile checks; inclusion never makes a source assertion true.
    range: OwnershipInterest
    multivalued: true
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
  interest_minimum_percentage:
    slot_uri: publicschema:interest_minimum_percentage
    title: Interest minimum percentage
    description: An inclusive lower percentage bound for an asserted interest on a zero-to-one-hundred
      scale. This is a bound, not an exact value; omit when unknown. An example profile distinguishes
      bounds from interest_percentage and from an exclusive bound on the same side.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
  interest_exclusive_minimum_percentage:
    slot_uri: publicschema:interest_exclusive_minimum_percentage
    title: Interest exclusive minimum percentage
    description: A percentage strictly below the asserted interest, on a zero-to-one-hundred scale.
      An interest exceeding twenty-five percent may use 25 here without inventing an exact amount.
      This is alternative to an inclusive lower bound.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
  interest_maximum_percentage:
    slot_uri: publicschema:interest_maximum_percentage
    title: Interest maximum percentage
    description: An inclusive upper percentage bound for an asserted interest on a zero-to-one-hundred
      scale. Omission means that this upper bound was not supplied; it does not imply an exact amount.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
  interest_exclusive_maximum_percentage:
    slot_uri: publicschema:interest_exclusive_maximum_percentage
    title: Interest exclusive maximum percentage
    description: A percentage strictly above the asserted interest, on a zero-to-one-hundred scale.
      This is alternative to an inclusive upper bound and never an exact percentage.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
