id: https://publicschema.org/linkml/ownership
name: publicschema-ownership
title: Ownership and control
description: Draft ownership and control interests and legal arrangements.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- common
- vocabularies
- value_types
classes:
  OwnershipInterest:
    class_uri: publicschema:OwnershipInterest
    title: Ownership Interest
    description: A stated ownership or control interest that a person, organization or legal arrangement
      holds in an organization or legal arrangement, such as a shareholding or voting rights. Separate
      interests may coexist. An indirect interest may list the direct interests that make up its route.
      Recording an interest does not decide who is a beneficial owner under any law.
    slots:
    - interest_holder
    - interest_entity
    - interest_type
    - interest_directness
    - interest_percentage
    - interest_minimum_percentage
    - interest_exclusive_minimum_percentage
    - interest_maximum_percentage
    - interest_exclusive_maximum_percentage
    - interest_description
    - component_interests
    - start_date
    - end_date
    status: bibo:draft
    annotations:
      bibliography_refs: '["gov-bods-04"]'
  LegalArrangement:
    class_uri: publicschema:LegalArrangement
    title: Legal Arrangement
    description: An arrangement, such as a trust or nominee agreement, through which people or organizations
      exercise ownership or control over an entity without forming a separate legal person. A trust that
      has legal personality is an Organization instead. Identifying an arrangement does not establish
      the identity, rights or beneficial ownership of its participants.
    slots:
    - name
    - identifiers
    - arrangement_type
    status: bibo:draft
    annotations:
      bibliography_refs: '["gov-bods-04"]'
slots:
  interest_holder:
    slot_uri: publicschema:interest_holder
    title: Interest holder
    description: The URI of the person, organization or legal arrangement that holds the interest.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      sensitivity: sensitive
  interest_entity:
    slot_uri: publicschema:interest_entity
    title: Interest entity
    description: The URI of the organization or legal arrangement in which the interest is held. A person
      is never the entity in which an interest is held.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
  interest_type:
    slot_uri: publicschema:interest_type
    title: Interest type
    description: How the interest is held or exercised, such as shares, voting rights or the right to
      appoint the board.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
  interest_directness:
    slot_uri: publicschema:interest_directness
    title: Interest directness
    description: Whether the interest is held directly, through intermediate entities or arrangements,
      or with unknown directness.
    range: InterestDirectness
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
  interest_percentage:
    slot_uri: publicschema:interest_percentage
    title: Interest percentage
    description: An exact asserted percentage for this interest, on a scale from zero to one hundred.
      Omit when only a band or uncertain amount is known; preserve that qualification in interest_description.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
  interest_description:
    slot_uri: publicschema:interest_description
    title: Interest description
    description: The local name for the interest or other details that explain it, such as bounds or
      uncertainty that the percentage slots cannot express.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      sensitivity: sensitive
  arrangement_type:
    slot_uri: publicschema:arrangement_type
    title: Arrangement type
    description: The kind of legal arrangement, such as a trust or nomination agreement. Its legal treatment
      depends on the applicable jurisdiction.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
      domain_override: 'null'
  component_interests:
    slot_uri: publicschema:component_interests
    title: Component interests
    description: The direct interests that together make up this indirect interest, each with its own
      holder, entity and period. Listing them does not verify the route or calculate an effective share.
    range: OwnershipInterest
    multivalued: true
    status: bibo:draft
    annotations:
      category: governance
      sensitivity: sensitive
      domain_override: 'null'
  interest_minimum_percentage:
    slot_uri: publicschema:interest_minimum_percentage
    title: Interest minimum percentage
    description: An inclusive lower percentage bound for an asserted interest on a zero-to-one-hundred
      scale. This is a bound, not an exact value; omit when unknown.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
  interest_exclusive_minimum_percentage:
    slot_uri: publicschema:interest_exclusive_minimum_percentage
    title: Interest exclusive minimum percentage
    description: A percentage strictly below the asserted interest, on a zero-to-one-hundred scale.
      An interest exceeding twenty-five percent may use 25 here without inventing an exact amount.
      This is alternative to an inclusive lower bound.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
  interest_maximum_percentage:
    slot_uri: publicschema:interest_maximum_percentage
    title: Interest maximum percentage
    description: An inclusive upper percentage bound for an asserted interest on a zero-to-one-hundred
      scale. Omission means that this upper bound was not supplied; it does not imply an exact amount.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
  interest_exclusive_maximum_percentage:
    slot_uri: publicschema:interest_exclusive_maximum_percentage
    title: Interest exclusive maximum percentage
    description: A percentage strictly above the asserted interest, on a zero-to-one-hundred scale.
      This is alternative to an inclusive upper bound and never an exact percentage.
    range: decimal
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      domain_override: 'null'
