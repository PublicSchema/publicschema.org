id: https://publicschema.org/linkml/agriculture_holdings
name: publicschema-agriculture-holdings
title: Agricultural holdings, parcels and holders
description: Farms, agricultural parcels, farmer registrations, agricultural holder roles and work on farms.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- common
- identity
- vocabularies
- value_types
- registry
- work
classes:
  Farm:
    class_uri: publicschema:agri/Farm
    title: Farm (agricultural holding)
    description: An economic unit of agricultural production under single management. It comprises all
      livestock kept and all land used wholly or partly for agricultural production, whatever the title,
      legal form or size. Its land may lie in one or more separate areas that share the same means of
      production. A farm may have no land, for example when it only keeps livestock. It is identified
      separately from the household, from the persons, organizations or groups responsible for it, and
      from the rights over its land. Summary fields such as the farm's area, land tenure types and livestock
      kept do not override detailed parcel, tenure or animal records.
    slots:
    - name
    - identifiers
    - farm_area
    - livestock_type
    - land_tenure
    - location
    status: bibo:draft
    annotations:
      source_domain: agri
      label_es: Finca
      label_fr: Exploitation agricole
      convergence_json: '{"notes": "Low coverage. Only DHIS2 (workaround) and OpenSPP have farm data models.",
        "system_count": 2, "total_systems": 6}'
      bibliography_refs: '["fao-vggt", "fao-wca-2020-vol1", "lsms-isa"]'
  AgriculturalParcel:
    class_uri: publicschema:agri/AgriculturalParcel
    title: Agricultural Parcel
    description: An identified, delimited area of land used or usable for agricultural production, as recorded
      by the source for a stated period. It is a land-use unit. It is not a cadastral parcel, a title unit
      or a census parcel of one tenure type, although its boundary may coincide with any of them. Use by
      one or more farms is recorded separately.
    slots:
    - name
    - identifiers
    - spatial_geometry
    - parcel_area
    - location
    - valid_from
    - valid_to
    status: bibo:draft
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2020-vol1", "unece-property-units-2004"]'
  HoldingParcelLink:
    class_uri: publicschema:agri/HoldingParcelLink
    title: Holding Parcel Link
    description: A dated statement that a farm uses all or part of an agricultural parcel. Several farms
      may use the same parcel. The link does not by itself assert exclusive use, ownership or a legal right.
    slots:
    - linked_holding
    - linked_parcel
    - used_area
    - start_date
    - end_date
    - evidence_assertions
    status: bibo:draft
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2020-vol1", "fao-vggt"]'
  FarmerRegistration:
    class_uri: publicschema:agri/FarmerRegistration
    title: Farmer Registration
    description: A registration recognizing a person, organization or group as a farmer or agricultural
      producer for a stated administrative purpose, optionally naming the farms it covers. It does not
      by itself establish holder responsibility, land rights or program eligibility.
    slots:
    - registered_farms
    slot_usage:
      registered_subject:
        description: The URI of the person, organization or group recognized as a farmer or agricultural
          producer.
    status: bibo:draft
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2020-vol1"]'
    is_a: Registration
  AgriculturalHolderRole:
    class_uri: publicschema:agri/AgriculturalHolderRole
    title: Agricultural Holder Role
    description: The responsibility of a person, organization or group for the key decisions on resource
      use and for management control of a farm, alone or jointly with others, during a stated period. It
      includes bearing the technical and economic responsibility for the farm. It is distinct from daily
      management, which may be delegated, and from ownership, employment and program entitlement. Several
      simultaneous roles for one farm describe joint holders. Dates describe when the role is effective,
      not when it was recorded.
    slots:
    - holder_farm
    - start_date
    - end_date
    - identifiers
    status: bibo:draft
    see_also:
    - https://www.fao.org/4/i4913e/i4913e.pdf
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2020-vol1"]'
    abstract: true
  PersonAgriculturalHolderRole:
    class_uri: publicschema:agri/PersonAgriculturalHolderRole
    title: Person Agricultural Holder Role
    description: An agricultural holder role borne by one person. It does not assert ownership, registration
      or benefit entitlement.
    slots:
    - holder_person
    status: bibo:draft
    see_also:
    - https://www.fao.org/4/i4913e/i4913e.pdf
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2020-vol1"]'
    is_a: AgriculturalHolderRole
  OrganizationAgriculturalHolderRole:
    class_uri: publicschema:agri/OrganizationAgriculturalHolderRole
    title: Organization Agricultural Holder Role
    description: An agricultural holder role borne by one organization with legal personality, such as
      a company, cooperative or public body. It does not assert ownership, registration or benefit entitlement.
    slots:
    - holder_organization
    status: bibo:draft
    see_also:
    - https://www.fao.org/4/i4913e/i4913e.pdf
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2020-vol1"]'
    is_a: AgriculturalHolderRole
  GroupAgriculturalHolderRole:
    class_uri: publicschema:agri/GroupAgriculturalHolderRole
    title: Group Agricultural Holder Role
    description: An agricultural holder role borne by a group of persons acting as one holder without
      legal personality, such as a household, clan or informal partnership. Its members need not be individually
      recorded.
    slots:
    - holder_group
    status: bibo:draft
    see_also:
    - https://www.fao.org/4/i4913e/i4913e.pdf
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2020-vol1"]'
    is_a: AgriculturalHolderRole
  HoldingWorkAssignment:
    class_uri: publicschema:agri/HoldingWorkAssignment
    title: Holding Work Assignment
    description: Work performed or intended to be performed by one person on a specified Farm during an
      optionally known period, including daily management, paid work and unpaid contributions. This may
      stand alone when only farm participation is known. An optional WorkRelationship identifies the separate
      economic relationship, for example with a labour agency or a contractor enterprise. Neither the assignment
      nor its function implies holder responsibility, ownership or employment by the Farm. Classifications
      describe this assignment; omitted values are not automatically copied from a linked relationship.
    slots:
    - work_person
    - assigned_holding
    - assignment_work_relationship
    - start_date
    - end_date
    - identifiers
    - work_functions
    - work_form
    - work_status
    - work_remuneration
    - work_seasonality
    status: bibo:draft
    see_also:
    - https://webapps.ilo.org/ilostat-files/Documents/ICSE-18_manual.pdf
    - https://unstats.un.org/UNSDWebsite/statcom/session_57/documents/BG-3g-1-Background_document_WCA_2030-E.pdf
    annotations:
      source_domain: agri
      bibliography_refs: '["ilo-icse18-manual-2023", "fao-wca2030-jan2026-draft"]'
slots:
  holder_farm:
    slot_uri: publicschema:agri/holder_farm
    title: Holder farm
    description: The farm to which this agricultural holder role applies.
    range: Farm
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
      bibliography_refs: '["fao-wca-2020-vol1"]'
  holder_person:
    slot_uri: publicschema:agri/holder_person
    title: Holder person
    description: The person who holds this agricultural holder role. It is not inferred from household
      membership, ownership or employment.
    range: Person
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
      bibliography_refs: '["fao-wca-2020-vol1"]'
  holder_organization:
    slot_uri: publicschema:agri/holder_organization
    title: Holder organization
    description: The organization that holds this agricultural holder role. It is not inferred from membership,
      ownership or employment.
    range: Organization
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
      bibliography_refs: '["fao-wca-2020-vol1"]'
  holder_group:
    slot_uri: publicschema:agri/holder_group
    title: Holder group
    description: The group that holds this agricultural holder role. It is not inferred from membership,
      ownership or employment.
    range: Group
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
      bibliography_refs: '["fao-wca-2020-vol1"]'
  registered_farms:
    slot_uri: publicschema:agri/registered_farms
    title: Registered farms
    description: The farms covered by this farmer registration.
    range: Farm
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
      bibliography_refs: '["fao-wca-2020-vol1"]'
  assigned_holding:
    slot_uri: publicschema:agri/assigned_holding
    title: Assigned holding
    description: The Farm on which this person performs or is intended to perform the assigned work. It
      does not identify the employer or economic unit by implication.
    range: Farm
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: employment
      bibliography_refs: '["ilo-icse18-manual-2023", "fao-wca2030-jan2026-draft"]'
  assignment_work_relationship:
    slot_uri: publicschema:agri/assignment_work_relationship
    title: Assignment work relationship
    description: The economic work relationship within which this holding assignment occurs. It must concern
      the same person. The assignment can be recorded without this link when a separate economic relationship
      is unknown or unnecessary.
    range: WorkRelationship
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: employment
      bibliography_refs: '["ilo-icse18-manual-2023", "fao-wca2030-jan2026-draft"]'
  work_functions:
    slot_uri: publicschema:agri/work_functions
    title: Work functions
    description: The functions performed in this work on the farm, such as daily management or harvesting,
      each coded in a stated classification. A function does not establish agricultural holder responsibility
      or status at work.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: employment
      bibliography_refs: '["ilo-icse18-manual-2023", "fao-wca2030-jan2026-draft"]'
  parcel_area:
    slot_uri: publicschema:agri/parcel_area
    title: Parcel area
    description: The measured area of the agricultural parcel, with its unit of measure.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
  linked_holding:
    slot_uri: publicschema:agri/linked_holding
    title: Linked holding
    description: The farm that uses the linked parcel.
    range: Farm
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
  linked_parcel:
    slot_uri: publicschema:agri/linked_parcel
    title: Linked parcel
    description: The agricultural parcel used by the farm during the relationship period.
    range: AgriculturalParcel
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
  used_area:
    slot_uri: publicschema:agri/used_area
    title: Used area
    description: The area of the linked parcel that this farm uses. Areas used by different farms may overlap;
      do not add them without an allocation rule.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: administrative
  farm_area:
    slot_uri: publicschema:agri/farm_area
    title: Farm area
    description: The total area of land operated by the farm, whatever the title, as declared or measured
      by the source, with its unit of measure. It is zero for a farm without land. It is not the sum of
      the areas of parcels shared with other farms.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
      bibliography_refs: '["fao-wca-2020-vol1"]'
  land_tenure:
    slot_uri: publicschema:agri/land_tenure
    title: Land tenure
    description: The kinds of arrangement under which the farm operates its land, such as ownership, rental,
      sharecropping or use of common land. A farm may operate land under several arrangements. This describes
      how the farm uses land; it is not a record of land rights.
    range: LandTenure
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      label_es: Tenencia de la tierra
      label_fr: Régime foncier
      category: agriculture
      sensitivity: sensitive
      bibliography_refs: '["fao-vggt", "fao-wca-2020-vol1", "lsms-isa"]'
  livestock_type:
    slot_uri: publicschema:agri/livestock_type
    title: Livestock type
    description: The kinds of livestock kept on the farm, whether or not the farm owns them.
    range: LivestockType
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      label_es: Tipo de ganado
      label_fr: Type de bétail
      category: agriculture
      bibliography_refs: '["dhs-recode7", "fao-wca-2020-vol1", "lsms-isa"]'
