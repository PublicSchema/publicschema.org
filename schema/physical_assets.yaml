id: https://publicschema.org/linkml/physical_assets
name: publicschema-physical-assets
title: Physical assets, responsibilities and addresses
description: Buildings, building units, the responsibilities that parties hold for physical assets, and
  the addresses assigned to those assets.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- common
- identity
- value_types
- registry
classes:
  AssetPartyRole:
    class_uri: publicschema:AssetPartyRole
    title: Asset Party Role
    description: A dated statement that a person, organization or group holds a stated responsibility for
      a physical asset, such as ownership, operation, upkeep or registered keeping. Each responsibility
      is recorded separately; holding one does not imply another or give permission to carry out a regulated
      activity.
    slots:
    - subject_uri
    - asset_actor
    - asset_role_type
    - start_date
    - end_date
    status: bibo:draft
    annotations:
      bibliography_refs: '["fhir-r5", "uk-dft-v5c-2010"]'
  AssetAddressAssignment:
    class_uri: publicschema:AssetAddressAssignment
    title: Asset Address Assignment
    description: A dated association between a physical asset and an address used for a stated purpose,
      such as postal delivery or site access. A change of address does not create a new asset or change
      its owner.
    slots:
    - subject_uri
    - assigned_address
    - address_purpose
    - start_date
    - end_date
    status: bibo:draft
    annotations:
      bibliography_refs: '["fhir-r5", "w3c-vcard-rdf"]'
  Building:
    class_uri: publicschema:Building
    title: Building
    description: A permanent, enclosed construction, above or below ground, used or intended to shelter
      people, animals or things, or to produce goods. A building's identity is separate from its addresses,
      the land parcel it stands on, its owners and any service delivered inside it.
    slots:
    - name
    - identifiers
    - building_use
    - spatial_geometry
    status: bibo:draft
    annotations:
      bibliography_refs: '["gov-inspire-buildings"]'
  BuildingUnit:
    class_uri: publicschema:BuildingUnit
    title: Building Unit
    description: A part of a building used as a separate unit in daily life, such as a dwelling, shop or
      office, usually with its own lockable entrance from outside or from a shared area. A unit need not
      be separately owned or have its own address.
    slots:
    - name
    - identifiers
    - within_building
    - building_use
    status: bibo:draft
    annotations:
      bibliography_refs: '["gov-inspire-buildings"]'
slots:
  building_use:
    slot_uri: publicschema:building_use
    title: Building use
    description: What a building or building unit is currently used for, such as housing, farming or public
      services, taken from a named classification. Several uses can apply at once.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      category: classification
  within_building:
    slot_uri: publicschema:within_building
    title: Within building
    description: The building that this building unit is part of.
    range: Building
    multivalued: false
    status: bibo:draft
    annotations:
      category: location
  asset_actor:
    slot_uri: publicschema:asset_actor
    title: Asset actor
    description: The URI of the person, organization or group that holds the responsibility for the asset.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
  asset_role_type:
    slot_uri: publicschema:asset_role_type
    title: Asset role type
    description: The responsibility the actor holds for the asset, such as ownership, operation, upkeep
      or registered keeping. Operation and upkeep are not ownership.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
  assigned_address:
    slot_uri: publicschema:assigned_address
    title: Assigned address
    description: The address associated with the asset for the stated purpose and period. An address change
      need not identify a different asset.
    range: Address
    multivalued: false
    status: bibo:draft
    annotations:
      category: location
  address_purpose:
    slot_uri: publicschema:address_purpose
    title: Address purpose
    description: The purpose of the address for this asset, such as postal delivery or physical access.
      A postal address does not establish where the asset is.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
