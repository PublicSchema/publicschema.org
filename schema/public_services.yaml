id: https://publicschema.org/linkml/public_services
name: publicschema-public-services
title: Public services and administrative history
description: Draft shared descriptions of public services, applications, decisions, appeals, organizational
  changes and service capacity. Submission rules and legal effects belong to the applicable procedure.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
  cpsv: http://purl.org/vocab/cpsv#
  cpov: http://data.europa.eu/m8g/
  org: http://www.w3.org/ns/org#
  sosa: http://www.w3.org/ns/sosa/
imports:
- linkml:types
- publicschema-extensions
- common
- core
- identity
- value_types
- registry
- organizations
- regulation
classes:
  PublicService:
    class_uri: publicschema:PublicService
    title: Public Service
    description: A set of activities that a public organization carries out, or has carried out on its
      behalf, to meet a public policy purpose. It may serve people, businesses or other organizations,
      and it exists whether or not anyone is currently using it or applying for it.
    slots:
    - name
    - identifiers
    - description
    - service_competent_authorities
    - service_audience
    - legal_resources
    status: bibo:draft
    close_mappings:
    - cpsv:PublicService
    annotations:
      bibliography_refs: '["semic-cpsv-ap"]'
      external_alignments_json: '[{"label": "Public Service", "match": "close", "note": "CPSV-AP 3.2.0 informs the separation of a catalogue service from its use and its audience and competent authority links. This smaller native description does not implement CPSV-AP cardinalities, its public funding criterion or its RDF wire profile.", "uri": "http://purl.org/vocab/cpsv#PublicService", "vocabulary": "CPSV-AP 3.2.0", "vocabulary_id": "semic"}]'
  ServiceApplication:
    class_uri: publicschema:ServiceApplication
    title: Service Application
    description: A request submitted to a public organization to use a public service or to obtain a
      decision under it. Its authority is the organization that received the request, and its subject
      URI names the person, organization, permission, asset or other subject the request is about. The
      applicant, the submitter and the subject can differ. Submission alone does not establish eligibility,
      registration, permission or an obligation to grant the request.
    is_a: Event
    slots:
    - public_service
    - service_applicant
    - subject_uri
    - submitted_by
    - submission_representation
    - authority
    - submission_date
    - evidence_assertions
    - recorded_at
    status: bibo:draft
    annotations:
      bibliography_refs: '["eu-reg-2018-1724", "semic-cpsv-ap"]'
  AdministrativeDecision:
    class_uri: publicschema:AdministrativeDecision
    title: Administrative Decision
    description: A decision made by an authority about a particular person, organization or thing under
      the rules it applies, such as granting a permit, imposing a measure or upholding an appeal. Its
      authority is the organization that made the decision, and its subject URI names the subject decided
      on. Its outcome, effective time and legal resources are interpreted in the applicable jurisdiction;
      recording a decision does not prove finality or current permission.
    is_a: Event
    slots:
    - decides_application
    - subject_uri
    - authority
    - decision_outcome
    - decision_date
    - effective_at
    - legal_resources
    - decision_authorizations
    - decision_regulatory_actions
    - resolves_appeal
    - evidence_assertions
    - recorded_at
    status: bibo:draft
    annotations:
      bibliography_refs: '["eu-reg-2018-1724", "semic-cpsv-ap"]'
  AdministrativeAppeal:
    class_uri: publicschema:AdministrativeAppeal
    title: Administrative Appeal
    description: A formal request to an authority to review a particular administrative decision. Its
      authority is the organization asked to review the decision; the appellant and the submitter are
      recorded separately. Filing an appeal does not by itself suspend, replace or overturn the challenged
      decision.
    is_a: Event
    slots:
    - challenged_decision
    - appellant
    - submitted_by
    - submission_representation
    - authority
    - submission_date
    - evidence_assertions
    - recorded_at
    status: bibo:draft
    annotations:
      bibliography_refs: '["semic-cpsv-ap"]'
  OrganizationalChangeEvent:
    class_uri: publicschema:OrganizationalChangeEvent
    title: Organizational Change Event
    description: A significant reorganization, such as a merger, split or takeover of functions, after
      which at least one organization has a new identity. Its authority is the organization that decided
      or reported the change. Earlier organizations and their past acts stay identifiable. A name correction
      that keeps identity can use RecordLifecycleEvent without introducing a successor organization.
    is_a: Event
    slots:
    - original_organizations
    - resulting_organizations
    - lifecycle_kind
    - effective_at
    - recorded_at
    - authority
    - evidence_assertions
    - legal_resources
    status: bibo:draft
    close_mappings:
    - org:ChangeEvent
    annotations:
      bibliography_refs: '["w3c-org"]'
      external_alignments_json: '[{"label": "Change Event", "match": "close", "note": "W3C ORG Recommendation 16 January 2014 supplies the original/resulting organization pattern for a material change with distinct identity. PublicSchema adds registry recording and effective timestamps and does not implement the PROV activity interval or ORG property-chain entailments.", "uri": "http://www.w3.org/ns/org#ChangeEvent", "vocabulary": "W3C ORG 2014", "vocabulary_id": "w3c-org"}]'
  ServiceCapacityObservation:
    class_uri: publicschema:ServiceCapacityObservation
    title: Service Capacity Observation
    description: A measurement of how much a service or facility can handle, such as staffed beds or school
      places, at a given time. Its subject URI names the facility or service observed. Capacity is not
      a promise of current availability or an accreditation.
    is_a: Event
    slots:
    - subject_uri
    - capacity_measure
    - capacity_quantity
    - capacity_observed_at
    status: bibo:draft
    close_mappings:
    - sosa:Observation
    annotations:
      bibliography_refs: '["fhir-r5", "regenstrief-ucum", "w3c-ssn-sosa"]'
slots:
  service_competent_authorities:
    slot_uri: publicschema:service_competent_authorities
    title: Service competent authorities
    description: The public organizations ultimately responsible for providing the service, whether or
      not they deliver it themselves. Past applications and decisions keep their own authorities when
      responsibility changes.
    range: PublicOrganization
    multivalued: true
    status: bibo:draft
    close_mappings:
    - cpov:hasCompetentAuthority
    annotations:
      category: governance
      external_alignments_json: '[{"label": "Has competent authority", "match": "close", "note": "CPSV-AP 3.2.0 informs the competent-authority relationship. This native optional field does not implement the upstream minimum cardinality or establish conformance to the full RDF profile.", "uri": "http://data.europa.eu/m8g/hasCompetentAuthority", "vocabulary": "CPSV-AP 3.2.0", "vocabulary_id": "semic"}]'
      bibliography_refs: '["semic-cpsv-ap"]'
  service_audience:
    slot_uri: publicschema:service_audience
    title: Service audience
    description: The kinds of people or organizations the service is meant for, such as individuals or
      businesses. An audience category does not decide that a particular applicant is eligible.
    range: CodedValue
    multivalued: true
    status: bibo:draft
    annotations:
      category: classification
  public_service:
    slot_uri: publicschema:public_service
    title: Public service
    description: The described public service to which this application is submitted.
    range: PublicService
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
  service_applicant:
    slot_uri: publicschema:service_applicant
    title: Service applicant
    description: The URI of the person, group or organization requesting the service, which may differ
      from whoever submits the request on its behalf.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
      sensitivity: sensitive
  submitted_by:
    slot_uri: publicschema:submitted_by
    title: Submitted by
    description: The person or organization that actually submitted the application or appeal, which may
      differ from the applicant or appellant. Identifying a submitter does not establish their authority
      to represent someone else.
    range: Agent
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
      sensitivity: sensitive
  submission_representation:
    slot_uri: publicschema:submission_representation
    title: Submission representation
    description: The representation relationship that the submitter relied on for this application or
      appeal. Its parties, period and scope still have to match the particular submission.
    range: RepresentationRole
    multivalued: false
    status: bibo:draft
    annotations:
      category: governance
      sensitivity: sensitive
  decides_application:
    slot_uri: publicschema:decides_application
    title: Decides application
    description: The service application determined by this decision. An authority-initiated action or
      an appeal determination need not originate from a service application.
    range: ServiceApplication
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
      sensitivity: sensitive
  decision_outcome:
    slot_uri: publicschema:decision_outcome
    title: Decision outcome
    description: The result of the decision, such as granted, refused, upheld or overturned. The legal
      meaning and effect of the code depend on its scheme and the applicable jurisdiction.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: classification
      sensitivity: sensitive
  decision_authorizations:
    slot_uri: publicschema:decision_authorizations
    title: Decision authorizations
    description: Permissions established by this decision. A later suspension or appeal is represented
      separately and does not rewrite the original grant or its issuing authority.
    range: Authorization
    multivalued: true
    status: bibo:draft
    annotations:
      category: governance
      sensitivity: sensitive
  decision_regulatory_actions:
    slot_uri: publicschema:decision_regulatory_actions
    title: Decision regulatory actions
    description: Regulatory actions resulting from this determination, with their own subjects, scopes
      and conditions. A linked action does not imply that every permission of its holder is affected.
    range: RegulatoryAction
    multivalued: true
    status: bibo:draft
    annotations:
      category: governance
      sensitivity: sensitive
  resolves_appeal:
    slot_uri: publicschema:resolves_appeal
    title: Resolves appeal
    description: The appeal determined by this decision. Resolution is a separate determination and
      retains the link to the original challenged decision.
    range: AdministrativeAppeal
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
      sensitivity: sensitive
  challenged_decision:
    slot_uri: publicschema:challenged_decision
    title: Challenged decision
    description: The administrative decision for which review is requested. This link alone gives no
      stay, replacement or reversal effect to the appeal.
    range: AdministrativeDecision
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
      sensitivity: sensitive
  appellant:
    slot_uri: publicschema:appellant
    title: Appellant
    description: The URI of the person, group or organization asking for the review, independently of
      any representative. A reference does not establish standing or a right of appeal under a law.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
      sensitivity: sensitive
  original_organizations:
    slot_uri: publicschema:original_organizations
    title: Original organizations
    description: Organizations that existed before this material organizational change. Participation
      in a change does not itself assert that each organization ceased to exist.
    range: Organization
    multivalued: true
    status: bibo:draft
    close_mappings:
    - org:originalOrganization
    annotations:
      category: governance
      external_alignments_json: '[{"label": "Original organization", "match": "close", "note": "W3C ORG Recommendation 16 January 2014 informs the original-organization link. This native field uses PublicSchema Organization references and does not implement ORG inverse properties or PROV property entailments.", "uri": "http://www.w3.org/ns/org#originalOrganization", "vocabulary": "W3C ORG 2014", "vocabulary_id": "w3c-org"}]'
      bibliography_refs: '["w3c-org"]'
  resulting_organizations:
    slot_uri: publicschema:resulting_organizations
    title: Resulting organizations
    description: Organizations created or materially changed by this event. A new organizational
      identity must not replace the identity of the issuer on its predecessor's historical acts.
    range: Organization
    multivalued: true
    status: bibo:draft
    close_mappings:
    - org:resultingOrganization
    annotations:
      category: governance
      external_alignments_json: '[{"label": "Resulting organization", "match": "close", "note": "W3C ORG Recommendation 16 January 2014 informs the resulting-organization link. This native field uses PublicSchema Organization references and does not implement ORG inverse properties or PROV property-chain entailments.", "uri": "http://www.w3.org/ns/org#resultingOrganization", "vocabulary": "W3C ORG 2014", "vocabulary_id": "w3c-org"}]'
      bibliography_refs: '["w3c-org"]'
  capacity_measure:
    slot_uri: publicschema:capacity_measure
    title: Capacity measure
    description: The kind of capacity measured, such as staffed beds rather than building beds.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
  capacity_quantity:
    slot_uri: publicschema:capacity_quantity
    title: Capacity quantity
    description: The amount measured for the stated capacity kind.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
  capacity_observed_at:
    slot_uri: publicschema:capacity_observed_at
    title: Capacity observed at
    description: The timestamp to which the capacity observation applies, not the time a record was entered.
    range: datetime
    multivalued: false
    status: bibo:draft
    annotations:
      category: administrative
