id: https://publicschema.org/linkml/land
name: publicschema-land
title: Land administration
description: Land spatial and administrative units, tenure assertions and boundary assertions.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- common
- vocabularies
- value_types
- registry
classes:
  LandSpatialUnit:
    class_uri: publicschema:land/LandSpatialUnit
    title: Land Spatial Unit
    description: A separately identified area of land, or volume of space, recorded in land administration.
      A cadastral parcel is one kind of spatial unit. A spatial unit is not itself a right or a title.
    slots:
    - name
    - identifiers
    - spatial_geometry
    - land_area
    - location
    status: bibo:draft
    annotations:
      source_domain: land
      bibliography_refs: '["iso-19152-1-2024", "unece-property-units-2004"]'
  LandAdministrativeUnit:
    class_uri: publicschema:land/LandAdministrativeUnit
    title: Land Administrative Unit
    description: A unit recorded in land administration to which one or more uniform rights, restrictions
      or responsibilities apply. It may be formally registered or informally or customarily recorded.
      It groups zero or more spatial units. It is not a territorial administrative area.
    slots:
    - name
    - identifiers
    - administrative_spatial_units
    status: bibo:draft
    annotations:
      source_domain: land
      bibliography_refs: '["iso-19152-1-2024", "unece-property-units-2004"]'
  LandTenureAssertion:
    class_uri: publicschema:land/LandTenureAssertion
    title: Land Tenure Assertion
    description: A statement that a party holds, or claims, a right, restriction or responsibility over
      an identified land administrative unit during a stated period. It records the claim and its evidence.
      It does not decide between competing claims and does not convert customary or informal tenure into
      registered ownership. Some restrictions and responsibilities have no named holder.
    slots:
    - tenure_holder
    - tenure_object
    - tenure_category
    - tenure_type
    - tenure_share
    - valid_from
    - valid_to
    - evidence_assertions
    status: bibo:draft
    annotations:
      source_domain: land
      bibliography_refs: '["fao-vggt", "iso-19152-1-2024", "unece-property-units-2004"]'
  LandBoundaryAssertion:
    class_uri: publicschema:land/LandBoundaryAssertion
    title: Land Boundary Assertion
    description: A statement of where the boundary of a land spatial unit lies and how far it is recognized
      or agreed, with its supporting evidence. Geometry alone does not establish legal agreement.
    slots:
    - boundary_unit
    - spatial_geometry
    - boundary_recognition
    - evidence_assertions
    - recorded_at
    status: bibo:draft
    annotations:
      source_domain: land
      bibliography_refs: '["fao-vggt", "iso-19152-1-2024", "unece-property-units-2004"]'
slots:
  land_area:
    slot_uri: publicschema:land/land_area
    title: Land area
    description: The measured area of a spatial land unit, distinct from ownership
      share.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
  administrative_spatial_units:
    slot_uri: publicschema:land/administrative_spatial_units
    title: Administrative spatial units
    description: The spatial units grouped by this land administrative unit. It may be empty where no
      cadastral map exists. A spatial unit can belong to more than one administrative unit.
    range: LandSpatialUnit
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
  tenure_holder:
    slot_uri: publicschema:land/tenure_holder
    title: Tenure holder
    description: The person, organization or group that holds or claims the right, or bears the restriction
      or responsibility. It may be absent for restrictions attached to the land alone. The URI does not
      create legal personality.
    range: uri
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
      sensitivity: sensitive
      bibliography_refs: '["iso-19152-1-2024"]'
  tenure_object:
    slot_uri: publicschema:land/tenure_object
    title: Tenure object
    description: The land administrative unit to which the right, restriction or responsibility applies.
    range: LandAdministrativeUnit
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
      bibliography_refs: '["iso-19152-1-2024"]'
  tenure_category:
    slot_uri: publicschema:land/tenure_category
    title: Tenure category
    description: Whether the assertion concerns a right, a restriction or a responsibility.
    range: TenureCategory
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
      bibliography_refs: '["iso-19152-1-2024"]'
  tenure_type:
    slot_uri: publicschema:land/tenure_type
    title: Tenure type
    description: The statutory, customary or informal kind of tenure asserted, coded in a stated classification
      and kept as recorded, without conversion to ownership.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
      sensitivity: sensitive
  tenure_share:
    slot_uri: publicschema:land/tenure_share
    title: Tenure share
    description: The holder's share of the right, restriction or responsibility, as a fraction of the
      whole from 0 to 1, where 1 is the entire interest. It is not a percentage. Shares in competing claims
      are not normalized or added.
    range: decimal
    minimum_value: 0
    maximum_value: 1
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
      bibliography_refs: '["iso-19152-1-2024"]'
  boundary_unit:
    slot_uri: publicschema:land/boundary_unit
    title: Boundary unit
    description: The spatial unit whose boundary is described.
    range: LandSpatialUnit
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
  boundary_recognition:
    slot_uri: publicschema:land/boundary_recognition
    title: Boundary recognition
    description: How far the asserted boundary is recognized or agreed, coded in a stated classification.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: land
      category: administrative
      sensitivity: sensitive
