id: https://publicschema.org/linkml/plants
name: publicschema-plants
title: Crops and plant material
description: Draft crop plantings, plant varieties, genetic resource accessions and seed lots.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- common
- identity
- value_types
- agriculture_holdings
- animals
classes:
  CropPlanting:
    class_uri: publicschema:agri/CropPlanting
    title: Crop Planting
    description: A cultivation episode involving one or more crop components on a holding or agricultural
      parcel. It can include mixed crops and perennial establishment; a declaration about it is a separate
      administrative assertion.
    slots:
    - planting_holding
    - planting_parcel
    - planting_components
    - planting_date
    - planting_season
    status: bibo:draft
    see_also:
    - https://www.fao.org/4/a0135e/a0135e05.htm
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2010-crop-concepts"]'
  CropPlantingComponent:
    class_uri: publicschema:agri/CropPlantingComponent
    title: Crop Planting Component
    description: One crop or variety cultivated within a planting episode. Components preserve mixed cropping
      without assuming their areas partition the land or have a common planting date.
    slots:
    - crop_kind
    - planted_variety
    - component_planting_date
    - component_planted_area
    status: bibo:draft
    see_also:
    - https://www.fao.org/4/a0135e/a0135e05.htm
    annotations:
      source_domain: agri
      bibliography_refs: '["fao-wca-2010-crop-concepts"]'
  PlantVariety:
    class_uri: publicschema:PlantVariety
    title: Plant Variety
    description: A plant grouping distinguished by inherited characteristics and capable of propagation
      as a unit. Its identity is separate from any national listing, breeder right, denomination approval,
      or physical batch of seed.
    slots:
    - name
    - biological_taxon
    - variety_denomination
    - breeder_reference
    - origin_accessions
    status: bibo:draft
    see_also:
    - https://www.upov.int/documents/d/upov/docs-en-pluto-contribute-pluto-tag-format-description.pdf
    annotations:
      bibliography_refs: '["upov-pluto-tag-format"]'
  GeneticResourceAccession:
    class_uri: publicschema:GeneticResourceAccession
    title: Genetic Resource Accession
    description: A plant genetic resource maintained as an identified accession by a genebank or collection.
      It may have multiple physical samples or seed lots and need not be a named variety. This draft covers
      plant accessions only.
    slots:
    - accession_number
    - holding_institute
    - biological_taxon
    - accession_variety
    - collection_date_text
    - accession_collected_on
    status: bibo:draft
    see_also:
    - https://www.genesys-pgr.org/documentation/apis
    annotations:
      bibliography_refs: '["genesys-api-passport"]'
  SeedLot:
    class_uri: publicschema:SeedLot
    title: Seed Lot
    description: A separately identified quantity of seed managed as one lot for handling, conservation,
      testing or distribution. Lot identity differs from variety and accession identity. A lot can contain
      multiple source lots or varieties without implying certification.
    slots:
    - name
    - seed_lot_identifiers
    - seed_lot_varieties
    - seed_lot_accessions
    - source_seed_lots
    - seed_lot_quantity
    - seed_lot_produced_on
    status: bibo:draft
    see_also:
    - https://inspection.canada.ca/en/plant-health/seeds/seed-inspection-procedures/oecd-and-eu
    annotations:
      bibliography_refs: '["cfia-qsp-152-1"]'
slots:
  planting_holding:
    slot_uri: publicschema:agri/planting_holding
    title: Planting holding
    description: Agricultural holding responsible for this cultivation episode; not necessarily the owner
      of its land.
    range: Farm
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  planting_parcel:
    slot_uri: publicschema:agri/planting_parcel
    title: Planting parcel
    description: Agricultural parcel on which this cultivation episode takes place.
    range: AgriculturalParcel
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  planting_components:
    slot_uri: publicschema:agri/planting_components
    title: Planting components
    description: Crops cultivated in this episode, preserving mixtures.
    range: CropPlantingComponent
    multivalued: true
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  planting_date:
    slot_uri: publicschema:agri/planting_date
    title: Planting date
    description: Date of planting when a complete common date is known.
    range: date
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  planting_season:
    slot_uri: publicschema:agri/planting_season
    title: Planting season
    description: Locally defined season designation with scheme context; it need not be a calendar year.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  crop_kind:
    slot_uri: publicschema:agri/crop_kind
    title: Crop kind
    description: Crop classification for this component, preserving the source code and terminology.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  planted_variety:
    slot_uri: publicschema:agri/planted_variety
    title: Planted variety
    description: Variety cultivated in this crop component, if identified.
    range: PlantVariety
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  component_planting_date:
    slot_uri: publicschema:agri/component_planting_date
    title: Component planting date
    description: Date this component was planted when known; components may be planted on different dates.
    range: date
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  component_planted_area:
    slot_uri: publicschema:agri/component_planted_area
    title: Component planted area
    description: Reported area for this component with an area unit; components can overlap, so their
      sum need not equal parcel area.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: agri
      category: agriculture
  variety_denomination:
    slot_uri: publicschema:variety_denomination
    title: Variety denomination
    description: Name used to designate this variety; spelling alone is not a global identifier or proof
      of approval.
    range: string
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  breeder_reference:
    slot_uri: publicschema:breeder_reference
    title: Breeder reference
    description: Reference assigned by the breeder, preserved as supplied and interpreted in breeder context.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  origin_accessions:
    slot_uri: publicschema:origin_accessions
    title: Origin accessions
    description: Accessions reported as origins of the variety, without asserting a complete pedigree.
    range: GeneticResourceAccession
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  accession_number:
    slot_uri: publicschema:accession_number
    title: Accession number
    description: Identifier assigned within the holding collection; it is not globally unique on its own.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  holding_institute:
    slot_uri: publicschema:holding_institute
    title: Holding institute
    description: Organization maintaining the accession.
    range: Organization
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  accession_variety:
    slot_uri: publicschema:accession_variety
    title: Accession variety
    description: Named variety associated with the accession, when established; accession and variety
      remain distinct.
    range: PlantVariety
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  collection_date_text:
    slot_uri: publicschema:collection_date_text
    title: Collection date text
    description: Original collecting date notation, including incomplete dates; retain its source format
      without fabricating precision.
    range: string
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  accession_collected_on:
    slot_uri: publicschema:accession_collected_on
    title: Accession collected on
    description: Complete date of collection when known.
    range: date
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  seed_lot_identifiers:
    slot_uri: publicschema:seed_lot_identifiers
    title: Seed lot identifiers
    description: Identifiers assigned to this physical lot, not to its variety or accession.
    range: Identifier
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  seed_lot_varieties:
    slot_uri: publicschema:seed_lot_varieties
    title: Seed lot varieties
    description: Varieties represented in the lot; an empty or absent list does not imply varietal purity.
    range: PlantVariety
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  seed_lot_accessions:
    slot_uri: publicschema:seed_lot_accessions
    title: Seed lot accessions
    description: Accessions whose material is represented by this seed lot.
    range: GeneticResourceAccession
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  source_seed_lots:
    slot_uri: publicschema:source_seed_lots
    title: Source seed lots
    description: Source lots used to form this lot; this alone does not express proportions or establish
      certified blend status.
    range: SeedLot
    multivalued: true
    status: bibo:draft
    annotations:
      category: agriculture
  seed_lot_quantity:
    slot_uri: publicschema:seed_lot_quantity
    title: Seed lot quantity
    description: Quantity describing this lot with an explicit unit; no inventory balance or current availability
      is implied.
    range: QuantityValue
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
  seed_lot_produced_on:
    slot_uri: publicschema:seed_lot_produced_on
    title: Seed lot produced on
    description: Complete date of production of this lot when known.
    range: date
    multivalued: false
    status: bibo:draft
    annotations:
      category: agriculture
