  # DHS indicator: HC_HHHD_H_MAL
  # Level1: Household Characteristics / Level2: Household headship
  hc_hhhd_h_mal:
    title: "Male-headed households"
    # TODO: DHS source is English-only; translations require separate authority
    description: "Percentage of households headed by men"
    value_type: proportion
    decimals: 1
    # TODO: map Level2 'Household headship' to MetricTopic
    concept_uri: publicschema:concept/dhs/household_headship
    dimensions:
      - publicschema:dim/ref_area
      - publicschema:dim/time_period
    calculation:
      scoring: proportion
      subject_class: publicschema:Household
      populations:
        - population_type: initial-population
          language: application/sql
          criteria: "SELECT id FROM ${ps.Household}"
        - population_type: denominator
          language: application/sql
          criteria: "SELECT id FROM ${ps.Household}"
        - population_type: numerator
          language: application/sql
          criteria: |
            SELECT DISTINCT h.id
            FROM ${ps.Household} h
            JOIN ${ps.GroupMembership} gm ON gm.group = h.id
            JOIN ${ps.Person} p ON p.id = gm.person
            WHERE gm.role = 'head'
              AND gm.is_active = true
              AND p.sex = 'male'
    aligns_with:
      - "https://api.dhsprogram.com/rest/dhs/indicators/HC_HHHD_H_MAL"
      # TODO: DHS technical doc PDF
    core: true
    version: "1.0.0"
    status: bibo:draft

