#
# Relevance filter rules (encoded in RELEVANCE_FILTER list in the script):
#   Level1 = 'Household Characteristics' — all Level2 sub-buckets
#   Level1 = 'Survey Characteristics', Level2 = 'Background characteristics'
#   Level1 = 'Education', Level2 = 'Educational attainment of the household population'
#   Level1 = 'Women's Empowerment', Level2 = 'House ownership and documentation'
#   Level1 = 'Women's Empowerment', Level2 = 'Participation in decision making: Major household purchases'
#   Level1 = 'Water and Sanitation', Level2 = 'Household sanitation facilities'
#   Level1 = 'Water and Sanitation', Level2 = 'Management of household excreta'
# DROP: all other Level1/Level2 buckets (HIV, malaria, fertility, anthropometry, etc.)
#
# MeasurementType → value_type mapping (from MEASUREMENT_TYPE_MAP in script):
#   Percent / Percentage → proportion
#   Mean, Median, Rate, Ratio → ratio
#   Number → count
#
# sex dimension added only when Level3 is exactly:
#   "Women", "Men", "Women and Men", or contains "by sex".

id: dhs_household_seed
title: DHS Program — Household and SP-adjacent indicator seed metric catalog
description: |
  Auto-generated seed from the ICF DHS Program indicators API, filtered to
  household characteristics and social-protection-adjacent categories.
  Selection rule: indicators must be derivable from PublicSchema household-level
  record data — Household.dwelling_type, Household.cooking_fuel,
  Household.electricity_access, Household.floor_material,
  Person.education_level, and asset/empowerment slots. Clinical indicators
  (HIV, malaria, fertility, anthropometry, immunisation) are excluded.
  Labels and definitions are English-only as provided by the DHS API.
  concept_uri values are auto-minted per DHS Level2 bucket (see
  schema/concept_schemes/dhs_household.yaml); this is mechanical grouping,
  not a curated SKOS scheme — see docs/follow-ups/dhs-concept-scheme.md.
  Topic mappings and translations are out of scope for this seed and tracked
  as TODOs. Calculation blocks are hand-authored for a small number of
  indicators (see HAND_AUTHORED_CALCULATIONS in the converter); the rest carry
  no calculation block.
source: "ICF, The DHS Program — DHS API"
license: "DHS indicator definitions are publicly available; data downloads require DHS Program registration"

