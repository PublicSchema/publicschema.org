id: https://publicschema.org/linkml/tax
name: publicschema-tax
title: Tax registration
description: Registration of persons and organizations with tax authorities.
license: CC-BY-4.0
default_prefix: publicschema
prefixes:
  publicschema: https://publicschema.org/
  linkml: https://w3id.org/linkml/
  bibo: http://purl.org/ontology/bibo/
imports:
- linkml:types
- value_types
- registry
classes:
  TaxRegistration:
    class_uri: publicschema:tax/TaxRegistration
    title: Tax Registration
    description: A tax authority's record that a person or organization is registered for a tax, or group
      of taxes, in its jurisdiction. A subject registered for several taxes can hold one registration
      for each. Neither the registration nor the tax identifier it issues shows by itself that tax is
      owed, that returns are due, that the subject is resident there, or that it complies.
    slots:
    - tax_type
    status: bibo:draft
    is_a: Registration
    annotations:
      source_domain: tax
      bibliography_refs: '["eu-dir-2006-112", "oecd-aeoi-tin", "tadat-field-guide-2019", "us-irs-tin"]'
      external_alignments_json: '[{"label": "POA 1: Integrity of the Registered Taxpayer Base", "match":
        "related", "note": "TADAT Field Guide (2019), indicators P1-1 and P1-2, assess the accuracy and coverage
        of the taxpayer register that these records make up.", "uri": "https://www.tadat.org/content/dam/tadat/en/assessments/TADAT%20Field%20Guide%202019%20-%20English.pdf",
        "vocabulary": "TADAT Field Guide 2019", "vocabulary_id": "tadat-field-guide-2019"}, {"label": "VAT
        identification", "match": "related", "note": "Council Directive 2006/112/EC, Articles 213 to 215,
        requires registration for one tax, value added tax, with its own identification number.", "uri":
        "https://eur-lex.europa.eu/eli/dir/2006/112/oj", "vocabulary": "Council Directive 2006/112/EC", "vocabulary_id":
        "eu-dir-2006-112"}]'
slots:
  tax_type:
    slot_uri: publicschema:tax/tax_type
    title: Tax type
    description: The tax, or group of taxes, that the registration covers, such as value added tax or
      personal income tax, taken from a named classification.
    range: CodedValue
    multivalued: false
    status: bibo:draft
    annotations:
      source_domain: tax
      category: classification
      external_alignments_json: '[{"label": "OECD classification of taxes", "match": "broad", "note": "The
        OECD Revenue Statistics headings 1000 to 6000 classify taxes, not registrations.", "uri": "https://www.oecd.org/content/dam/oecd/en/topics/policy-sub-issues/global-tax-revenues/oecd-classification-taxes-interpretative-guide.pdf",
        "vocabulary": "OECD Classification of Taxes", "vocabulary_id": "oecd-tax-classification"}, {"label":
        "Taxes (GFSM 2014 classification 11)", "match": "broad", "note": "IMF Government Finance Statistics
        Manual 2014 heading 11 and its subheadings classify taxes, not registrations.", "uri": "https://www.imf.org/external/pubs/ft/gfs/manual/pdf/class.pdf",
        "vocabulary": "IMF GFSM 2014", "vocabulary_id": "imf-gfsm-2014"}]'
      bibliography_refs: '["imf-gfsm-2014", "oecd-tax-classification"]'
